<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fragezeichen mit Neumorph-Button</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(145deg, rgb(243, 220, 248), #6895dd);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            color: white;
            font-family: 'VT323', monospace;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        #fragezeichen {
            font-size: 10rem;
            color: white;
            animation: yDrehen 2s linear infinite;
            transform-style: preserve-3d;
        }

        @keyframes yDrehen {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            background: rgba(224, 224, 224, 0.8);
            box-shadow: 8px 8px 16px rgba(0,0,0,0.1),
            -8px -8px 16px rgb(192, 191, 236);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            color: #37414e;
            font-family: 'VT323', monospace;
        }

        button:active {
            box-shadow: inset 8px 8px 16px rgba(0,0,0,0.1),
            inset -8px -8px 16px rgba(255,255,255,0.6);
        }

        button:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div id="fragezeichen">?</div>
    <button onclick="document.location='card.html'" >Ereigniskarte anzeigen</button>
</div>
</body>
</html>
